# Project information
site_name: DeGov.AI Docs
site_url: https://docs.degov.ai
site_description: "DeGov.AI is a governance platform that leverages AI to enhance decision-making and community engagement."
copyright: Copyright &copy; RingDAO 2026

# Repository information
repo_name: ringecosystem/degov-docs
repo_url: https://github.com/ringecosystem/degov-docs
edit_uri: https://github.com/ringecosystem/degov-docs/edit/main/docs

theme:
  name: material
  custom_dir: docs/overrides
  logo: resource/pics/degov.svg
  favicon: resource/pics/degov.svg
  font:
    code: SFMono-Regular
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.share
    - search.suggest
    - search.highlight
    - toc.follow
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple

extra:
  generator: false
  homepage: https://degov.ai
  social_preview:
    site_name: DeGov.AI Docs
    title_suffix: " | DeGov.AI Docs"
    image: https://degov.ai/images/degov-social-card.png
    image_width: 1200
    image_height: 630
    image_type: image/png
    image_alt: "DeGov.AI Docs — governance guides for better communities."
    twitter_site: "@ai_degov"
  status:
    new: Recently added
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ringecosystem
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/ai_degov
    - icon: fontawesome/brands/telegram
      link: https://t.me/RingDAO_Hub

  analytics:
    provider: google
    property: 
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            using our <a href="https://github.com/ringecosystem/degov-docs/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">feedback form</a>.
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

extra_css:
  - resource/stylesheets/extra.css

extra_javascript:
  - resource/javascripts/navigation-analytics.js

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight

plugins:
  - search
  - meta-descriptions:
      enable_checks: true
      max_length: 500
      trim: true
  - git-authors
  - git-revision-date-localized:
      fallback_to_build_date: false
      enable_creation_date: true
  - redirects:
      redirect_maps:
        "roadmap.md": "index.md"
        "best-practices.md": "index.md"
        "degovx/overview.md": "index.md"
        "governance/agent/overview.md": "governance/overview.md"
        "governance/agent/review.md": "governance/overview.md"
        "governance/agent/delegate.md": "governance/overview.md"
        "governance/agent/voting.md": "governance/overview.md"
        "governance/agent/faqs.md": "governance/overview.md"

nav:
  - Home:
      - What is DeGov.AI?: index.md
      - FAQs: faqs.md
  - DeGov Square:
      - Overview: governance/overview.md
      - Basic Concepts:
        - What are DAOs?: governance/intro/daos.md
        - OnChain / OffChain: governance/intro/onchain-offchain.md
        - Governance Model: governance/intro/model.md
      - Proposal:
        - Overview: governance/proposal/overview.md
        - Lifecycle: governance/proposal/lifecycle.md
        - Vote Delegation: governance/proposal/delegation.md
        - Voting: governance/proposal/voting.md
      - Key Parameters:
        - Overview: governance/parameters/overview.md
        - Proposal thresholds: governance/parameters/proposal-thresholds.md
        - Quorum: governance/parameters/quorum.md
        - Proposal delay: governance/parameters/proposal-delay.md
        - Voting period: governance/parameters/voting-period.md
        - TimeLock delay: governance/parameters/timelock-delay.md
      - Get Notifications:
        - Email Notifications: governance/notifications/email.md
      - Integration:
        - Overview: integration/overview.md
        - Setup Instructions: integration/deploy.md
        - DAOs Registry: integration/registry.md
        - Launch With Assistant: integration/launch.md
  - DeGov Atlas:
      - Overview: atlas/index.md
      - Browse DAOs: atlas/browse-daos.md
      - Proposals & Outcomes: atlas/proposals-and-outcomes.md
      - Votes & Voters: atlas/votes-and-voters.md
      - Discussions, Timelines & Signals: atlas/discussions-timelines-signals.md
      - Governance Data: atlas/governance-data.md
      - Atlas vs. Agent API: atlas/atlas-vs-agent-api.md
  - Agent API:
      - Overview: agent-api/index.md
      - Quickstart: agent-api/quickstart.md
      - Authentication: agent-api/authentication.md
      - Pricing & Rate Limits: agent-api/pricing-and-rate-limits.md
      - Concepts:
        - Overview: agent-api/concepts/index.md
        - Response Envelope: agent-api/concepts/response-envelope.md
        - Proposal & Topic Keys: agent-api/concepts/proposal-and-topic-keys.md
        - Pagination: agent-api/concepts/pagination.md
        - Readiness & Coverage: agent-api/concepts/readiness-and-coverage.md
        - Timestamps & Numbers: agent-api/concepts/timestamps-and-numbers.md
        - Errors: agent-api/concepts/errors.md
      - Guides:
        - Overview: agent-api/guides/index.md
        - Find Active Proposals: agent-api/guides/find-active-proposals.md
        - Resolve an External Proposal: agent-api/guides/resolve-external-proposal.md
        - Follow Governance Signals: agent-api/guides/follow-governance-signals.md
        - Build a Cited Research Brief: agent-api/guides/build-cited-research.md
        - Inspect Proposal Votes: agent-api/guides/inspect-proposal-votes.md
        - Research Voters: agent-api/guides/research-voters.md
        - Browse Forum Topics: agent-api/guides/browse-forum-topics.md
      - API Reference:
        - Overview: agent-api/reference/index.md
        - Current v2: agent-api/reference/v2.md
        - Metadata: agent-api/reference/v2-metadata.md
        - DAOs: agent-api/reference/v2-daos.md
        - Proposals: agent-api/reference/v2-proposals.md
        - Forum: agent-api/reference/v2-forum.md
        - Events & Signals: agent-api/reference/v2-feeds.md
        - Voters: agent-api/reference/v2-voters.md
        - v1 Compatibility: agent-api/reference/v1.md
      - Migration Guide: agent-api/migration-v1-to-v2.md
  - Agent Skills:
      - Overview: agent-skills/index.md
      - DAO Governance Research: agent-skills/dao-governance-research.md
      - DAO Governance Security: agent-skills/dao-governance-security.md
