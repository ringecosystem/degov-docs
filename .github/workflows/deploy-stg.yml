name: Deploy staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build mkdocs
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m mkdocs build --strict
          python scripts/verify-social-metadata.py --fetch-image
          python scripts/verify_navigation_analytics.py
          python scripts/verify_ga4_activation.py --expect-disabled
          python scripts/verify-agent-api-docs.py

      - uses: darwinia-network/devops/actions/smart-vercel@main
        name: Deploy to Vercel
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: itering
          preview_output: true
          project_name: degov-docs
          dist_path: site
          script_run: false
          enable_notify_slack: false
          slack_channel: public-degov
          slack_webhook: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
